name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# One run at a time per branch or PR, and a newer push replaces a waiting one,
# so an older build never deploys after a newer one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Fork PRs get no secrets, so they stop after the build (D30).
      SAME_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.SAME_REPO == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: pages deploy dist --project-name=virtualhajj --branch=${{ github.head_ref || github.ref_name }}

      - name: Wait for the deployment to answer
        if: env.SAME_REPO == 'true'
        run: curl --fail --silent --show-error --output /dev/null --retry 12 --retry-delay 5 --retry-all-errors "$BASE_URL"
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
      - if: env.SAME_REPO == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: env.SAME_REPO == 'true'
        run: pnpm e2e
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
      - if: failure() && env.SAME_REPO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
