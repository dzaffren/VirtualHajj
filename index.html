<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VirtualHajj</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="root">
      <!-- The Loading card shows before the bundle arrives; React replaces it with the same markup. -->
      <div class="app" data-state="loading">
        <div class="backdrop"></div>
        <div class="card">
          <p class="card-name">VirtualHajj</p>
          <p class="card-say" aria-live="polite">
            <span
              class="when-loading"
              aria-hidden="false"
              data-ms="Memuatkan Kaabah…"
              >Loading the Kaabah…</span
            >
            <span
              class="when-ready"
              aria-hidden="true"
              data-ms="Seret untuk melihat sekeliling Kaabah."
              >Drag to look round the Kaabah.</span
            >
          </p>
          <p class="card-hint">
            <span class="hint-touch" data-ms="Cubit untuk zum masuk dan keluar."
              >Pinch to zoom in and out.</span
            >
            <span
              class="hint-mouse"
              data-ms="Tatal untuk zum. Dengan papan kekunci, kekunci anak panah memusingkan pandangan, dan + serta − untuk zum."
            >
              Scroll to zoom. With the keyboard, the arrow keys turn the view
              and + and − zoom.
            </span>
          </p>
          <a class="primary-button" href="/tawaf/" data-ms="Mula tawaf"
            >Start tawaf</a
          >
        </div>
      </div>
    </div>
    <script>
      // Before the bundle runs: the learner's language, as src/settings.ts picks it, so a Malay browser never sees English first.
      // Then a browser that can't run the bundle would keep the Loading card for ever, so say so.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("vh.lang");
        } catch (e) {}
        var first = (navigator.language || "").split("-")[0].toLowerCase();
        var ms = stored === "ms" || (stored !== "en" && first === "ms");
        document.documentElement.lang = ms ? "ms" : "en";
        var swap = document.querySelectorAll("[data-ms]");
        for (var i = 0; ms && i < swap.length; i++)
          swap[i].textContent = swap[i].getAttribute("data-ms");

        var ok = !!document.createElement("canvas").getContext("webgl2");
        try {
          new Function("class A { static {} }");
        } catch (e) {
          ok = false;
        }
        if (ok) return;
        var app = document.querySelector(".app");
        app.setAttribute("data-state", "no-webgl");
        app.querySelector(".card").innerHTML =
          '<p class="card-name">VirtualHajj</p>' +
          '<p class="card-say" aria-live="polite"><span>' +
          (ms
            ? "Pelayar ini tidak dapat menunjukkan paparan 3D."
            : "This browser can't show the 3D view.") +
          "</span></p>" +
          '<p class="card-body">' +
          (ms
            ? "Buka pautan ini dalam Chrome atau Safari yang terkini."
            : "Open this link in an up-to-date Chrome or Safari.") +
          "</p>";
      })();
    </script>
    <script type="module" src="/src/viewer/main.tsx"></script>
  </body>
</html>
