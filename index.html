<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VirtualHajj</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="root">
      <!-- The Loading card shows before the bundle arrives; React replaces it with the same markup. -->
      <div class="app" data-state="loading">
        <div class="backdrop"></div>
        <div class="card">
          <p class="card-name">VirtualHajj</p>
          <p class="card-say" aria-live="polite">
            <span class="when-loading" aria-hidden="false"
              >Loading the Kaabah…</span
            >
            <span class="when-ready" aria-hidden="true"
              >Drag to look round the Kaabah.</span
            >
          </p>
          <p class="card-hint">
            <span class="hint-touch">Pinch to zoom in and out.</span>
            <span class="hint-mouse">
              Scroll to zoom. With the keyboard, the arrow keys turn the view
              and + and − zoom.
            </span>
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/viewer/main.tsx"></script>
  </body>
</html>
